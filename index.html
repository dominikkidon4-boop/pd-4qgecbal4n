<style>

 background:radial-gradient(70% 60% at 50% 0%,rgba(40,180,90,.16),transparent 70%)}

.kb{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}.kr{font-size:12.5px}.kr .l{display:flex;justify-content:space-between}.kr .l b{color:var(--red)}

.g{color:var(--grn)}.r{color:var(--red)}.m{color:var(--mut)}.lbl{color:var(--mut);font-size:12px}.empty{color:var(--mut);font-size:13px;padding:4px 0}
.fg{animation:fg 1.2s}.fr{animation:fr 1.2s}@keyframes fg{0%{background:rgba(53,232,116,.4)}100%{background:transparent}}@keyframes fr{0%{background:rgba(255,75,85,.4)}100%{background:transparent}}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(540px,94vw);z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;background:rgba(18,26,22,.94);border:1.5px solid rgba(53,232,116,.45);border-radius:20px;padding:12px 16px;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:tin .45s cubic-bezier(.2,1.3,.4,1)}
.toast.neg{border-color:rgba(255,75,85,.5)}.toast .av{width:44px;height:44px;font-size:18px}
.toast .tx{flex:1;min-width:0}.toast .a{font-size:12px;color:var(--mut);letter-spacing:.3px}.toast .b{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toast .c{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .amt{font:800 22px var(--sans)}
@keyframes tin{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
footer{color:var(--dim);font-size:11px;text-align:center;margin-top:12px}
details summary{cursor:pointer;color:var(--mut);font-size:13px;margin-top:6px}
.isdelayed .live{background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.6);color:#fbbf24}.isdelayed .live i{background:#f59e0b;animation:none}
.chart polyline,.chart polygon{transition:all .6s ease}

<script>window.__REMOTE__={"api": "https://api.github.com/gists/6dc819e272e03b4655c631c4a0e23af0", "file": "s.json", "tfile": "t.json", "poll_ms": 75000, "live_poll_ms": 240000, "stale_sec": 300, "hb_stale_sec": 30};</script>
<script>
const EMBED = window.__EMBED__ || null;
const REMOTE = window.__REMOTE__ || null;
let lastRemote=null, remoteWait=60000, remoteTimer=null, TOK=null, ably=null, ablyState="off", lastMsgLocal=0, srvOffset=0, gistKick=null;
const TZ = "Europe/Warsaw";
let S=null, src="", curD=-1, curP=-1, es=null, pollTimer=null, shownEq=null, badgeShown={}, posPrev={}, IMG={}, LOG=[], logEl=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const fT=(ts,sec=false)=>ts?new Date(ts).toLocaleTimeString("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:sec?"2-digit":undefined}):"—";
const fDT=ts=>ts?new Date(ts).toLocaleString("en-GB",{timeZone:TZ,day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const usd=(v,d=2)=>v==null?"—":(v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sus=v=>(v>=0?"+":"-")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const sp=(v,d=1)=>v==null?"—":(v>=0?"+":"")+v.toFixed(d)+"%";
const px=v=>v==null?"—":(v>=1?v.toFixed(4):Number(v).toPrecision(4));
const cl=v=>v>=0?"g":"r", cc=v=>v>=0?"cg":"cr";
const age=ts=>ts?(Date.now()-new Date(ts))/1000:1e9;
const rel=s=>s<60?`${Math.max(0,Math.round(s))}s ago`:s<3600?`${Math.round(s/60)} min ago`:`${(s/3600).toFixed(1)} h ago`;
const held=s=>s<3600?`${Math.round(s/60)} min`:`${(s/3600).toFixed(1)} h`;
const num=n=>Number(n).toLocaleString("en-US");
const PAL=["#e11d48","#2563eb","#16a34a","#d97706","#7c3aed","#0891b2","#db2777","#65a30d"];
function av(sym,mint){const u=IMG[mint];const L=esc((sym||"?").replace(/^\$/,"")[0]||"?").toUpperCase();let h=0;for(const ch of (mint||sym||""))h=(h*31+ch.charCodeAt(0))>>>0;
  return `<span class="av" style="background:${PAL[h%PAL.length]}">${u&&!EMBED?`<img src="${esc(u)}" alt="" onerror="this.remove()">`:""}${u&&!EMBED?"":L}</span>`}
const AG={scout:["#3b82f6","Scout","new pairs",'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',"rgba(59,130,246,.18)","#7fb3ff"],
 filter:["#f59e0b","Filter","8 kill rules",'<path d="M4 5h16l-6 8v5l-4 2v-7z"/>',"rgba(255,75,85,.16)","#ff8a90"],
 analyst:["#8b5cf6","Analyst","score 55+ only",'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',"rgba(139,92,246,.2)","#b9a3ff"],
 executor:["#22c55e","Executor","max size",'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',"rgba(53,232,116,.16)","#7ff0a8"],
 risk:["#c84bd8","Risk","-6% stop · trail",'<path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/>',"rgba(200,75,216,.2)","#e6a3ef"],
 logger:["#2dd4bf","Logger","reason for all",'<path d="M7 3h7l4 4v14H7z"/><path d="M10 11h5M10 15h5"/>',"rgba(45,212,191,.16)","#8ff0e0"]};
const SC={SCOUT:"#7fb3ff",FILTER:"#f6a83b",ANALYST:"#a78bfa",EXECUTOR:"#35e874",RISK:"#d58ae0",LOGGER:"#5eead4"};
const RL={"liquidity<15k":"liq < $15k","vol_h1<15k":"1h vol < $15k","h1_change>80%":"+80% in 1h","bundled>10%":"bundled launch","top10>50%":"top 10 holders",
 "lp_not_burned_or_locked":"LP not burned","mint_authority_not_revoked":"mint not revoked","freeze_authority_not_revoked":"freeze not revoked","dev_holds>3%":"dev > 3%","rugcheck_unavailable":"no rugcheck"};
function killTxt(reason){const p=(reason||"").split("; ")[0];const [k,v]=p.split(": ");return (RL[k]||k)+(v?" "+v.replace(/\s.*$/,""):"")}
function animNum(el,from,to,fmt){if(!el)return;if(from==null||Math.abs(from-to)<1e-9){el.innerHTML=fmt(to);return}
  const t0=performance.now(),D=900;(function f(t){const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.innerHTML=fmt(k<1?from+(to-from)*e:to);if(k<1)requestAnimationFrame(f)})(t0)}
function mintBox(m){return `<div class="mint"><span>${esc(m)}</span><button onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(m)}');this.textContent='copied'">copy</button></div>
<div class="links"><a target="_blank" rel="noopener" href="https://dexscreener.com/solana/${esc(m)}">DexScreener ↗</a><a target="_blank" rel="noopener" href="https://solscan.io/token/${esc(m)}">Solscan ↗</a></div>`}
function chart(c,start){
  if(!c||c.length<2) return "";
  const W=560,H=110,ys=c.map(p=>p.equity),xs=c.map(p=>new Date(p.ts).getTime());
  let lo=Math.min(...ys),hi=Math.max(...ys); if(hi-lo<0.5){const m=(hi+lo)/2;hi=m+.25;lo=m-.25}
  const x0=xs[0],x1=Math.max(xs[xs.length-1],x0+1),X=t=>(t-x0)/(x1-x0)*(W-8),Y=v=>H-6-(v-lo)/(hi-lo)*(H-20);
  const pts=c.map((p,i)=>`${X(xs[i]).toFixed(1)},${Y(p.equity).toFixed(1)}`).join(" ");
  const col=ys[ys.length-1]>=start?"#35e874":"#ff4b55",lx=X(xs[xs.length-1]),ly=Y(ys[ys.length-1]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:calc(100% + 32px);display:block">
  <defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient>
  <filter id="gl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <polygon points="0,${H} ${pts} ${lx},${H}" fill="url(#gf)"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.6" filter="url(#gl)" vector-effect="non-scaling-stroke"/>
  <circle cx="${lx}" cy="${ly}" r="4" fill="${col}"><animate attributeName="r" values="3.5;6;3.5" dur="1.6s" repeatCount="indefinite"/></circle></svg>`;
}
/* ---------- header / ticker ---------- */
function header(){ if(!S) return; const lc=S.last_cycle, st=S.settings;
  let stale=!lc||age(lc.ts)>st.stale_after_sec||age(S.last_risk_tick)>60;
  if(REMOTE){ const live=isLive(), rt=(Date.now()+srvOffset-new Date(S.last_risk_tick))/1000;
    if(live){ stale=!lc||!(rt<=(REMOTE.hb_stale_sec||30)); }
    else { const g=new Date(S.generated_at).getTime();stale=age(S.generated_at)>REMOTE.stale_sec||!lc||(g-new Date(lc.ts))/1000>300||(g-new Date(S.last_risk_tick))/1000>60; }
    const mode=stale?"STALE":live?"LIVE":"DELAYED";
    $("root").classList.toggle("isstale",stale); $("root").classList.toggle("isdelayed",mode==="DELAYED"); $("livetxt").textContent=mode;
    $("lastcycle").textContent=(lc?`cycle #${lc.cycle} at ${fT(lc.ts,true)}`:"no cycle yet")+` · risk tick ${rel(live?rt:age(S.last_risk_tick))}`+
      (stale?(live?" · desk not ticking (stopped)":" · data older than one cycle"):"")+" · Europe/Warsaw"+(live?" · realtime":` · fallback, published ${rel(age(S.generated_at))}`);
    return; }
  $("root").classList.toggle("isstale",stale); $("livetxt").textContent=stale?"STALE":"Live";
  $("lastcycle").textContent=(lc?`cycle #${lc.cycle} at ${fT(lc.ts,true)}`:"no cycle yet")+` · risk tick ${rel(age(S.last_risk_tick))}`+(stale?` · data older than one cycle`:"")+" · Europe/Warsaw"+(EMBED?" · offline snapshot":"")+(REMOTE?` · published ${rel(age(S.generated_at))}`:""); }
function setTape(){
  const op=S.open_positions||[]; let items;
  if(op.length) items=op.map(p=>({mint:p.mint,sym:p.symbol,price:p.current_price,pc:p.pnl_pct_price,lab:""}));
  else items=(S.ticker||[]).map(x=>({mint:x.mint,sym:x.symbol,price:x.price,pc:x.pc_h1,lab:"1h"}));
  const el=$("tape"); if(!items.length){el.innerHTML='<span class="m">no tokens</span>';el.dataset.k="";return}
  const k=items.map(i=>i.mint).join(",")+(op.length?"|o":"|t");
  const html=i=>`<span class="it" data-m="${esc(i.mint)}">${av(i.sym,i.mint)}${esc(i.sym)} <span class="px">${px(i.price)}</span> <span class="chip ${cc(i.pc||0)}">${sp(i.pc)}${i.lab?" "+i.lab:""}</span></span>`;
  if(el.dataset.k!==k){let one=items.map(html).join("");while(one.length<1500&&items.length)one+=items.map(html).join("");el.innerHTML=one+one;el.dataset.k=k;return}
  for(const i of items) el.querySelectorAll(`[data-m="${CSS.escape(i.mint)}"]`).forEach(n=>{n.querySelector(".px").textContent=px(i.price);const c=n.querySelector(".chip");c.className="chip "+cc(i.pc||0);c.textContent=sp(i.pc)+(i.lab?" "+i.lab:"")});
}
/* ---------- agent rows ---------- */
function agRow(k,mid,tag){const [c,n,sub,path,bg,fg]=AG[k];return `<div class="ag" id="ag-${k}"><div class="ic" style="background:${c}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${path}</svg></div>
 <div class="nm"><b>${n}</b><small id="ag-${k}-sub">${esc(k==="executor"?`${(S.settings.max_position_pct*100).toFixed(0)}% max size`:sub)}</small></div><div class="mid" id="ag-${k}-mid">${mid}</div><span class="tag" id="ag-${k}-tag" style="background:${bg};color:${fg}">${tag}</span></div>`}
function lastDec(stage,pred){return LOG.find(d=>d.stage===stage&&(!pred||pred(d)))}
function midFor(k,progMsg){
  if(k==="scout") return `<span>${esc(progMsg||"DexScreener + GeckoTerminal…")}</span>`;
  if(k==="filter"){const d=lastDec("FILTER",d=>d.decision==="KILL");return d?`${av(d.symbol,d.mint)}<s>$${esc(d.symbol)}</s> <span class="x">× ${esc(killTxt(d.reason))}</span>`:"<span>no kills yet</span>"}

    ably=AblyPubSub.createClient({authCallback:async(params,cb)=>{try{ if(!TOK||!TOK.token_details||TOK.token_details.expires<Date.now()+120000) await getRemote(); cb(null,TOK.token_details) }catch(e){cb(String(e&&e.message||e),null)}},
      disconnectedRetryTimeout:4000,suspendedRetryTimeout:15000});
    ably.connection.on(sc=>{const was=isLive();ablyState=sc.current;if(sc.current==="connected"){src=SRC_LIVE;$("src").textContent=src}if(was&&sc.current!=="connected"){src=SRC_FALL;kickRemote(3000)}header()});
    ably.channels.get(TOK.channel).subscribe(onAbly);
  }catch(e){console.warn(e);ablyState="failed"}
}
const SRC_LIVE="realtime via Ably (updates within ~1–2 s)", SRC_FALL="fallback: published from the desk every ~2 min";
async function main(){
  if(REMOTE){ try{S=await getRemote()}catch(e){$("root").classList.add("isstale");$("livetxt").textContent="STALE";$("lastcycle").textContent="cannot load published data ("+e.message+") — retrying";setTimeout(main,remoteWait);return}
    src=SRC_FALL; curD=S.max_decision_id; curP=S.max_progress_id||0; IMG=S.images||{};
    LOG=(S.feed||[]).concat((S.events||[]).filter(e=>!(S.feed||[]).some(f=>f.id===e.id))).sort((a,b)=>b.id-a.id);
    for(const e of S.events||[]){const f=LOG.find(x=>x.id===e.id);if(f){f.pnl=e.pnl;f.size_usd=e.size_usd}}
    render(); setInterval(header,1000); lastRemote=S; startAbly(); remoteTimer=setTimeout(remoteLoop,REMOTE.poll_ms); return; }
  if(EMBED){S=EMBED;src="embedded snapshot (offline file — not live)";}
  else{ try{const r=await fetch("api/state",{cache:"no-store"});S=await r.json()}catch(e){$("root").classList.add("isstale");$("livetxt").textContent="STALE";$("lastcycle").textContent="cannot reach /api/state";return}
    src="live stream from local server"; curD=S.max_decision_id; curP=S.max_progress_id||0; }
  IMG=S.images||{};
  LOG=(S.feed||[]).concat((S.events||[]).filter(e=>!(S.feed||[]).some(f=>f.id===e.id))).sort((a,b)=>b.id-a.id);
  for(const e of S.events||[]){const f=LOG.find(x=>x.id===e.id);if(f){f.pnl=e.pnl;f.size_usd=e.size_usd}}
  render(); setInterval(header,1000); if(!EMBED){startStream(); setInterval(refreshState,120000)}
}
